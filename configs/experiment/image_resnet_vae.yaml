# @package _global_
# Same single-modality image experiment as image_vae.yaml, but composing
# image_resnet_single_latent (the residual "ResNet-style" 2D encoder/decoder, ADR 0018, spec §7)
# instead of image_single_latent. The image counterpart of signal_resnet_vae.yaml. Assembles
# model + data + training into one composed, validated
# global_vae.config.experiment.ExperimentConfig.
# Run with: python scripts/train.py --config-name experiment/image_resnet_vae
# Or, to compare against the plain conv model without a second experiment file at all, override
# the model group directly on top of image_vae.yaml instead:
#   python scripts/train.py --config-name experiment/image_vae model=image_resnet_single_latent ...
# Override anything else from the command line exactly as with image_vae.yaml, e.g.:
#   python scripts/train.py --config-name experiment/image_resnet_vae \
#       data.train_path=/path/to/images data.loader_factory=my_project.data:buildImageDataloaders \
#       model.single_latent.dim=32 training.num_epochs=50
defaults:
  - /model: image_resnet_single_latent
  - /data: image
  - /training: default
  - _self_

seed: 0
deterministic: false
output_dir: outputs/image_resnet_vae

# Loss scale for images (docs/adr/0029-loss-scale-convention.md, docs/how-to/choose-beta.md). Under
# the default `mean` reduction, `beta = 1` weights the KL N / 2 = 2048 times more than the ELBO
# does for a 64 x 64 image (N = 4096 values); image_vae.yaml, the same experiment with the plain
# 2D pair, collapsed under it on the synthetic images of examples/04_paired_loader.py (30 epochs,
# 0 of 16 latent units active, R^2 of -0.13 against the mean image). `sum` with weight 0.5 is the
# ELBO of a unit-variance Gaussian decoder, so `beta = 1` (the warm-up of training/default.yaml)
# is its natural position: this experiment, on the same data and epochs, used all 16 units and
# reached an R^2 of 0.64. These are numbers from synthetic data, not a tuned value: the choice of
# beta is roadmap decision D-6, which waits for a real run. Delete the `training` block below to
# go back to `mean`.
training:
  reconstruction_reduction: sum
  reconstruction_weight: 0.5
