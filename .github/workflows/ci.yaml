name: CI

# Lint, type-check and tests on every push and every pull request (spec section 10,
# roadmap P0-1). The docs build and deploy live in docs.yaml and are unchanged.
#
# Required checks on `main` (a repository setting, not a file): lint, types,
# tests (3.11) and tests (3.13). All four are blocking: `ruff check .` and `ruff format --check .`
# exit 0 since the CamelCase module names were renamed (roadmap P0-2, decision D-9, ADR 0023).

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer run on the same ref replaces the one in flight, except on main where every
# commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Coverage floor, in percent. The measured value is 96.25% (roadmap section 2.1), so the
  # floor sits one point below it. Raise it as coverage improves, never lower it.
  COVERAGE_FLOOR: "95"
  # Dependencies are resolved once per job from pyproject.toml. The CPU wheel of torch is
  # installed first: the default PyPI wheel drags in several GB of CUDA libraries that a
  # GPU-less runner never uses. The second pip call then finds torch already satisfied.
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url "$TORCH_CPU_INDEX"
          pip install -e ".[dev,docs]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        # Run even when `ruff check` failed, so one run reports both.
        if: ${{ !cancelled() }}
        run: ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pinned to the interpreter that `python_version` in [tool.mypy] names (3.11, the oldest
      # supported Python), see roadmap P0-8. tests/unit/test_typecheck_config.py fails when the
      # two disagree. Do not move this job to 3.12 or newer on its own: pip would then install
      # numpy 2.5, whose stubs make mypy fail on `python_version = "3.11"`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url "$TORCH_CPU_INDEX"
          pip install -e ".[dev,docs]"

      - name: mypy
        # Scope and strictness come from [tool.mypy] in pyproject.toml: `src`, `scripts`,
        # `examples` and `tests` (relaxed, no annotation requirement on test functions).
        run: mypy

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The `docs` extra is installed on purpose: without it the test that builds the real
      # docs site (tests/integration/test_docs_adr_navigation.py) skips itself silently.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url "$TORCH_CPU_INDEX"
          pip install -e ".[dev,docs]"

      # -rs lists every skipped test with its reason, so a skip that should not happen
      # (a missing optional dependency) shows up in the log instead of passing unnoticed.
      # There is no `-m "not slow"` here on purpose: CI runs the whole suite, unit and
      # integration, slow tests included. The fast loops (`pytest tests/unit`,
      # `pytest -m "not slow"`) are for local work only, see README.md.
      - name: pytest
        run: >
          pytest -rs
          --cov=global_vae
          --cov-report=term-missing:skip-covered
          --cov-fail-under="$COVERAGE_FLOOR"
