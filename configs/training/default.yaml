# Default training configuration for the signal-VAE milestone (spec §6.1 milestone 1).
# Validated against global_vae.config.training.TrainingConfig
# (see src/global_vae/config/training.py). `${output_dir}` interpolates against the
# composing experiment config's own `output_dir` (see configs/experiment/signal_vae.yaml).
num_epochs: 200

optimizer:
  name: adam
  kwargs:
    lr: 0.001

# A loss name (mse, l1, bce, smooth_l1) and a weight (a number of at least 0), for every modality or
# per decoder, for example `{signal: mse, mask: bce}` and `{signal: 0.5, image: 2.0}`. A decoder left
# out keeps mse and 1.0; a decoder the model does not have is an error. See
# docs/adr/0030-per-modality-reconstruction-loss-and-weight.md and docs/how-to/train.md.
reconstruction_loss: mse
reconstruction_weight: 1.0
# How each modality's reconstruction loss is scaled: `mean` (the per-element mean, the default) or
# `sum` (the per-sample sum, which is the scale of the KL term), for every modality or per decoder,
# for example `{signal: sum, image: mean}`. Changing it changes what `beta` means: see
# docs/adr/0029-loss-scale-convention.md and docs/how-to/choose-beta.md.
reconstruction_reduction: mean

# A single scalar beta would risk posterior collapse this early (mu -> 0, logvar -> 0
# is a trivial way to drive KL to zero before the decoder learns to use z); linear
# warm-up is the standard mitigation (docs/adr/0004-pluggable-beta-schedules.md).
beta: 1.0
beta_schedules:
  z_fused:
    strategy: linear_warmup
    kwargs:
      warmup_steps: 1000
      start_value: 0.0
      end_value: 1.0

modality_dropout_p: 0.0 # single modality: nothing to drop (spec §5)
grad_clip_norm: null
device: null # null auto-detects cuda, falling back to cpu
log_every_n_steps: 50

loggers:
  - name: csv
    kwargs:
      path: ${output_dir}/metrics.csv
  - name: tensorboard
    kwargs:
      log_dir: ${output_dir}/tensorboard

# Registry name -> constructor kwargs (docs/adr/0022-callback-registry.md); any
# combination of global_vae.training.callbacks.registry.listRegisteredCallbacks() may
# be listed, in any order, including none at all. Instantiated, and called by Trainer,
# in this mapping's own order, after every logger above.
callbacks:
  checkpoint:
    directory: ${output_dir}/checkpoints
    every_n_epochs: 10
    keep_last_n: 3
  best_checkpoint:
    path: ${output_dir}/checkpoints/best.pt
    monitor: val/loss/total
    mode: min
