# Single-modality image VAE (spec §6.1 milestone 2, image side): `image -> z -> image`, no
# fusion strategy since exactly one encoder feeds the single latent space (spec §4). The image
# counterpart of signal_single_latent.yaml, with the plain 2D CNN pair (ADR 0017) in place of
# the 1D one. Validated against global_vae.config.model.ModelConfig
# (see src/global_vae/config/model.py).
#
# The batch an experiment feeds this model carries one key, `image`, a (batch, 64, 64) tensor
# (one grayscale channel; a (batch, 1, 64, 64) tensor works too). A signal plus image model is
# default.yaml; the residual variant of this file is image_resnet_single_latent.yaml.
name: global_vae_image_single_latent
latent_mode: single

modalities:
  image:
    encoder:
      name: 2d_cnn_encoder_v1
      kwargs:
        # One grayscale channel (in_channels defaults to 1). Each stage is followed by a 2x2 max
        # pool, and a global average pool then makes the head independent of the input height
        # and width.
        hidden_channels: [16, 32, 64]
        # latent_dim is intentionally omitted: buildModelFromConfig fills it in from
        # single_latent.dim below, so it only has to be set in one place.
    decoder:
      name: 2d_cnn_decoder_v1
      kwargs:
        # output_shape must match the images your own loader_factory yields (height, width):
        # the decoder never resizes, and a shape it cannot reach is an error at construction.
        # With conv_transpose (kernel 4, stride 2, padding 1) each of the 3 hidden_channels
        # entries doubles the default 8 x 8 seed, 8 -> 16 -> 32 -> 64, so [64, 64]. Use
        # TwoDCnnDecoder.computeOutputShape(...) to verify any configuration before committing
        # to it.
        output_shape: [64, 64]
        hidden_channels: [64, 32, 16]
        upsample_modes: conv_transpose

single_latent:
  dim: 16
  name: z_fused
  # fusion: omitted on purpose. A single encoder needs no Fusion strategy at all
  # (spec §4); GlobalVae.createSingleLatent already treats this as optional.
  regularizer:
    strategy: kl_standard_normal
