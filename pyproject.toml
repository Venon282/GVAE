[project]
name = "global-vae"
version = "0.1.0"
description = "Modular, extensible multimodal Variational Autoencoder framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tensorboard>=2.14",  # exercised for real by tests/integration/test_loggers.py
    "matplotlib>=3.7",    # exercised for real by tests/integration/test_visualization*.py
    "scikit-learn>=1.3",  # exercised for real by tests/integration/test_latent_plot.py (t-SNE)
    "umap-learn>=0.5",    # exercised for real by tests/integration/test_latent_plot.py (UMAP)
    "scipy>=1.10",        # exercised for real by tests/integration/test_transforms.py (ResampleTransform coordinate-aware mode)
]
# Soft dependency: only needed to actually construct TrainerCallback.training.loggers.
# TensorBoardLogger; importing global_vae or the loggers subpackage never requires it
# (the import is deferred to TensorBoardLogger.__init__ itself).
tensorboard = [
    "tensorboard>=2.14",
]
# `visualization/` needs matplotlib unconditionally (every function returns a Figure); `tsne`
# and `umap` are further soft dependencies of only `latent_plot.projectLatentSamples`'s
# corresponding methods, imported lazily inside that function, not required for PCA (torch-
# native, no extra dependency) or for the loss-curve/reconstruction/beta-schedule plots.
visualization = [
    "matplotlib>=3.7",
]
tsne = [
    "scikit-learn>=1.3",
]
umap = [
    "umap-learn>=0.5",
]
# Soft dependency of ResampleTransform(interpolation="scipy") only (data/transforms/resample.py,
# spec §6.2): coordinate-aware resampling (explicit source_coords/target_coords, and interpolation
# methods beyond torch.nn.functional.interpolate's evenly-spaced-grid modes: cubic/pchip/akima
# splines, any scipy.interpolate.interp1d kind). ResampleTransform's default
# interpolation="torch" mode, and every other transform in this subpackage, need nothing beyond
# torch; importing global_vae.data.transforms never requires scipy (the import is deferred to
# ResampleTransform's own coordinate-aware code path).
interpolation = [
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# N802 (function name should be lowercase), N803 (argument name should be
# lowercase), N806 (variable in function should be lowercase) are disabled
# on purpose: this project uses a deliberate custom convention where
# functions/methods are camelCase instead of PEP8 snake_case (see spec
# §10 "Naming convention" and README.md "Naming convention"). Without this
# override, ruff would silently "fix" camelCase names back to snake_case.
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["global_vae"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["global_vae"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "hydra.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "umap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
