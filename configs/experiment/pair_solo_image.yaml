# @package _global_
# Stage 2 of the staged pair recipe (roadmap P6-1, docs/how-to/train-in-stages.md): a solo VAE of
# the image, `image -> z -> image`, trained as an ordinary run. The model is the single-latent image
# model of image_vae.yaml, with the same loss scale; what is new is `training.stage`, which makes
# every checkpoint of the run carry a stage manifest (the label, the modalities, the latent space
# and its width, a digest of the model config), so that the pair stage can check it loaded the file
# it meant to (docs/adr/0051-stage-manifest-and-solo-recipes.md).
#
# It reads the data contract of the signal plus image pair (batches with `signal` and `image`), so
# the same loader and the same data folder serve the three stages. The model uses the `image` key
# only and ignores `signal`. For a real recipe, give this stage a loader that yields EVERY sample
# that has an image, paired or not: the solo stages are where the unpaired samples are used, and the
# scarce pairs are kept for the pair stage. The shipped loader (examples/04_paired_loader.py)
# yields the pairs only, which is enough to run the recipe.
#
# Run with (the repository root on PYTHONPATH so that `examples.04_paired_loader` imports):
#   PYTHONPATH=. python scripts/train.py --config-name experiment/pair_solo_image \
#       data.loader_factory=examples.04_paired_loader:buildPairedDataloaders \
#       data.train_path=/path/to/paired_dataset
# The checkpoints are written to `outputs/pair_solo_image/checkpoints/` (`best.pt` is the one the
# pair stage should take).
defaults:
  - /model: image_single_latent
  - /data: signal_image
  - /training: default
  - _self_

seed: 0
deterministic: false
output_dir: outputs/pair_solo_image

# Loss scale for images, the one of image_vae.yaml (its comment has the numbers and the reason: under
# the default `mean` reduction and `beta = 1` a 64 x 64 image collapses the model, and `sum` with
# weight 0.5 is the ELBO of a unit-variance Gaussian decoder). Not a tuned value: the choice of beta
# is roadmap decision D-6.
training:
  stage: solo_image
  reconstruction_reduction: sum
  reconstruction_weight: 0.5
