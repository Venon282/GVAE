# @package _global_
# Signal plus image through one shared transformer (spec §2.1 `E1-L1-D1`, ADR 0027, roadmap
# P3-5): composes signal_image_shared_transformer, the data contract of signal_image.yaml and the
# default training. Assembles model + data + training into one composed, validated
# global_vae.config.experiment.ExperimentConfig.
# Run with:
#   python scripts/train.py --config-name experiment/signal_image_shared_transformer_vae \
#       data.train_path=/path/to/data data.loader_factory=my_project.data:buildPairedDataloaders
# The batches carry `signal` and `image`, each both an encoder input and its decoder's target;
# examples/04_paired_loader.py is a reference loader that serves them.
defaults:
  - /model: signal_image_shared_transformer
  - /data: signal_image
  - /training: default
  - _self_

seed: 0
deterministic: false
output_dir: outputs/signal_image_shared_transformer_vae

# Loss scale (docs/adr/0029-loss-scale-convention.md, docs/how-to/choose-beta.md). Under the
# default `mean` reduction the KL weighs N / 2 times the ELBO of each modality (N = 256 for the
# signal, 4096 for the image), and on the synthetic pairs of examples/04_paired_loader.py (60
# epochs, about 800 training pairs) this model collapsed: 0 of 32 latent units active, R^2 near 0
# for both modalities. `sum` with weight 0.5 is the ELBO of a unit-variance Gaussian decoder, so
# `beta = 1` (the warm-up of training/default.yaml) is its natural position: this experiment then
# used 9 of 32 units and reached an R^2 of 0.99 for the signal and 0.45 for the image. Numbers
# from synthetic data, not a tuned value: the choice of beta is roadmap decision D-6, which waits
# for a real run. Limit to know about (roadmap P3-5 finding): keep these settings single
# values, as below, for a model with a shared decoder. A mapping per modality
# (`{signal: ..., image: ...}`) is refused, because the config layer keys the settings by decoder
# instance name (`backbone_out`); a mapping by that name is accepted but the loss reads the keys
# `signal` and `image`, so a weight or a reduction is silently not applied and a loss function
# raises `KeyError` at the first step. Delete the `training` block below to go back to `mean`.
training:
  reconstruction_reduction: sum
  reconstruction_weight: 0.5
