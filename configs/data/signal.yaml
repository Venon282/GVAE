# Data contract for the signal-VAE milestone (spec §6.1 milestone 1). Framework-agnostic
# on purpose: no dataset/transform code lives here or anywhere in this framework
# (data/NOTE.md); `loader_factory` must point at your own
# "module.path:function_name" returning a global_vae.config.data.DataloaderBundle.
# `train_path`/`loader_factory` below are left as required (`???`, Hydra's MISSING
# marker): fill them in, or override on the command line
# (e.g. `data.train_path=... data.loader_factory=my_project.data:buildSignalDataloaders`).
loader_factory: ??? # e.g. "my_project.data:buildSignalDataloaders"
train_path: ???      # e.g. "data/raw/saxs_train"
val_path: null
test_path: null

batch_size: 32
num_workers: 0
val_split: 0.1
test_split: 0.1
shuffle_train: true

# Named preprocessing steps your own pipeline applies, in order (spec §6: e.g.
# log-scale SAXS intensity is standard). Names only: this framework has no built-in
# transform implementations (see visualization.reconstruction_plot's own
# inverse_transform docstring for the same "framework/data boundary" reasoning).
transforms:
  - log_intensity
  - standardize

# Target fixed length after resampling to a common q-grid, if applicable (spec §6.1's
# decision A2: interpolation to a shared grid is near-lossless when only resolution
# differs; needed if your curves' *q*-domains genuinely differ). Must match
# configs/model/signal_single_latent.yaml's decoder.kwargs.output_length.
sequence_length: 256

seed: 0
