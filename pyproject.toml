[project]
name = "global-vae"
version = "0.1.0"
description = "Modular, extensible multimodal Variational Autoencoder framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# N802 (function name should be lowercase), N803 (argument name should be
# lowercase), N806 (variable in function should be lowercase) are disabled
# on purpose: this project uses a deliberate custom convention where
# functions/methods are camelCase instead of PEP8 snake_case (see spec
# §10 "Naming convention" and README.md "Naming convention"). Without this
# override, ruff would silently "fix" camelCase names back to snake_case.
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["global_vae"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["global_vae"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "hydra.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
