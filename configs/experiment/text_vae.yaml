# @package _global_
# Full experiment for a single-modality text VAE (spec §6, roadmap P3-8): assembles model + data +
# training into one composed, validated global_vae.config.experiment.ExperimentConfig. The text
# counterpart of signal_vae.yaml, image_vae.yaml, tabular_vae.yaml and audio_vae.yaml.
# Run with:
#   python scripts/train.py --config-name experiment/text_vae \
#       data.train_path=/path/to/sentences data.loader_factory=my_project.data:buildTextDataloaders
# The batches carry one key, `text`, both the encoder input and its decoder's target. For another
# text length or vocabulary, set it in every place it is written: the data file's
# `sequence_length.text`, the decoder's `output_length`, and `vocab_size` in the encoder and the
# decoder, for example
#   data.sequence_length.text=16 model.modalities.text.decoder.kwargs.output_length=16
defaults:
  - /model: text_transformer_single_latent
  - /data: text
  - /training: default
  - _self_

seed: 0
deterministic: false
output_dir: outputs/text_vae

# Loss (docs/adr/0029-loss-scale-convention.md, docs/adr/0041-text-modality.md,
# docs/adr/0048-reconstruction-loss-and-metric-registries.md, docs/how-to/choose-beta.md).
# `token_cross_entropy` is the likelihood of a text under a categorical decoder: the decoder gives raw
# scores (`output_activation: null`, set below, since a softmaxed output would be softmaxed twice) and
# the loss reads the batch tensor as token ids `(batch, length)` or as the one-hot tensor of
# configs/data/text.yaml. It is a mean over the tokens, so `sum` makes it the cross-entropy of the
# whole text, on the scale of the KL term, and a weight of w on it is a beta of 1 / w on the KL
# (roadmap decision D-6).
# On a synthetic grammar (4,000 texts of 8 tokens over a vocabulary of 32, 3,500 to train and 500 to
# score, 60 epochs, two seeds), the best constant guess is 45.5% of the tokens. Weight 0.5 stayed
# near it (52% of the tokens, 1 of 16 latent units active), weight 1.0, the exact likelihood, reached
# 56% with 6 units, weight 2.0 gave 99.5% and 98.3% of the tokens (96% and 86% of whole texts, 15 and
# 16 units), and weight 4.0 gave 100% on both seeds. So 2.0 is a middle setting measured on synthetic
# data, not a tuned one, and a weight above 1.0 means a beta below 1 on the KL. The earlier stand-in
# (`bce` on the one-hot tensor) gave the same picture at the same weights. With a `mean`
# reduction the stand-in collapsed (docs/how-to/choose-beta.md).
model:
  modalities:
    text:
      decoder:
        kwargs:
          output_activation: null

training:
  reconstruction_loss: token_cross_entropy
  reconstruction_reduction: sum
  reconstruction_weight: 2.0
