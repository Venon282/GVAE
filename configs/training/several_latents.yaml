# Training configuration for models with several latent spaces (spec §9, ADR 0025). The same as
# default.yaml except for what depends on the model's latent space names: beta is per latent
# space (spec §2.3, docs/adr/0004-pluggable-beta-schedules.md), and a name that belongs to no
# model would be ignored, so there is no `beta_schedules` entry here. The experiment file adds
# one entry per latent space it declares (configs/experiment/signal_image_shared_private.yaml).
# A latent space without an entry is weighted by the plain `beta` below.
# Validated against global_vae.config.training.TrainingConfig (see
# src/global_vae/config/training.py). `${output_dir}` interpolates against the composing
# experiment config's own `output_dir`.
num_epochs: 200

optimizer:
  name: adam
  kwargs:
    lr: 0.001

# A loss name (mse, l1, bce, smooth_l1) and a weight (a number of at least 0), for every modality or
# per decoder, for example `{signal: mse, mask: bce}` and `{signal: 0.5, image: 2.0}`. A decoder left
# out keeps mse and 1.0; a decoder the model does not have is an error. See
# docs/adr/0030-per-modality-reconstruction-loss-and-weight.md and docs/how-to/train.md.
reconstruction_loss: mse
reconstruction_weight: 1.0
# How each modality's reconstruction loss is scaled: `mean` (the per-element mean, the default) or
# `sum` (the per-sample sum, which is the scale of the KL term), for every modality or per decoder,
# for example `{signal: sum, image: mean}`. Changing it changes what `beta` means: see
# docs/adr/0029-loss-scale-convention.md and docs/how-to/choose-beta.md.
reconstruction_reduction: mean

beta: 1.0
beta_schedules: {}

# Several modalities, so a modality can be hidden from the encoders during training, which
# trains the model to work from what is left (spec §5). At least one is always kept.
modality_dropout_p: 0.15
grad_clip_norm: null
device: null # null auto-detects cuda, falling back to cpu
log_every_n_steps: 50

# Trainer options, each off by default; see
# docs/adr/0031-mixed-precision-gradient-accumulation-and-compile.md.
# `mixed_precision`: null (full precision), bf16 or fp16. `accumulate_grad_batches`: batches added
# together before one optimizer step; a step is then an update, which is what `log_every_n_steps`,
# a beta warm-up and a learning-rate schedule count. `compile_model` runs the forward pass through
# torch.compile, with `compile_kwargs` passed to it.
mixed_precision: null
accumulate_grad_batches: 1
compile_model: false
compile_kwargs: {}
# Continue a run from one of its checkpoints, for example
# `training.resume_from=runs/signal_vae/checkpoints/checkpoint_epoch_0039.pt`. `num_epochs` is the
# total of the run, so only the epochs after the checkpoint's are trained
# (docs/adr/0032-resume-from-the-training-script.md).
resume_from: null

loggers:
  - name: csv
    kwargs:
      path: ${output_dir}/metrics.csv
  - name: tensorboard
    kwargs:
      log_dir: ${output_dir}/tensorboard

callbacks:
  best_checkpoint:
    path: ${output_dir}/checkpoints/best.pt
    monitor: val/loss/total
    mode: min
  # Last, so that the periodic checkpoints, the ones a run is resumed from, hold the state of
  # the callbacks above it as of the epoch they were written; see
  # docs/adr/0032-resume-from-the-training-script.md.
  checkpoint:
    directory: ${output_dir}/checkpoints
    every_n_epochs: 10
    keep_last_n: 3
