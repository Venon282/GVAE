[project]
name = "global-vae"
# The version is not written here: it is read from `global_vae.__version__` (see
# `[tool.setuptools.dynamic]` below), the single place to edit at release time.
dynamic = ["version"]
description = "Modular, extensible multimodal Variational Autoencoder framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # `import global_vae.config` reaches `data/transforms/resample.py`, which imports numpy at
    # module level (for its `np.ndarray` annotations), so numpy is a hard dependency.
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "mypy~=2.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tensorboard>=2.14",  # exercised for real by tests/integration/test_loggers.py
    "mlflow>=3.9",        # exercised for real, offline, by tests/integration/test_mlflow_logger.py
    "matplotlib>=3.7",    # exercised for real by tests/integration/test_visualization*.py
    "scikit-learn>=1.3",  # exercised for real by tests/integration/test_latent_plot.py (t-SNE)
    "umap-learn>=0.5",    # exercised for real by tests/integration/test_latent_plot.py (UMAP)
    "scipy>=1.10",        # exercised for real by tests/unit/test_transforms.py (ResampleTransform coordinate-aware mode)
]
# Soft dependency: only needed to actually construct TrainerCallback.training.loggers.
# TensorBoardLogger; importing global_vae or the loggers subpackage never requires it
# (the import is deferred to TensorBoardLogger.__init__ itself).
tensorboard = [
    "tensorboard>=2.14",
]
# Soft dependency: only needed to actually construct TrainerCallback.training.loggers.
# MlflowLogger; importing global_vae or the loggers subpackage never requires it (the import is
# deferred to MlflowLogger.__init__ itself, which is also why `import mlflow`, a slow import, is
# not paid by a run that logs elsewhere). Offline runs need nothing more: a `sqlite:///` tracking
# URI keeps the runs in a local file (docs/adr/0035-mlflow-experiment-logger.md).
mlflow = [
    "mlflow>=3.9",
]
# `visualization/` needs matplotlib unconditionally (every function returns a Figure); `tsne`
# and `umap` are further soft dependencies of only `latent_plot.projectLatentSamples`'s
# corresponding methods, imported lazily inside that function, not required for PCA (torch-
# native, no extra dependency) or for the loss-curve/reconstruction/beta-schedule plots.
visualization = [
    "matplotlib>=3.7",
]
tsne = [
    "scikit-learn>=1.3",
]
umap = [
    "umap-learn>=0.5",
]
docs = [
    "mkdocs>=1.6,<=1.6.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "ruff~=0.16.0",
]
# Soft dependency of ResampleTransform(interpolation="scipy") only (data/transforms/resample.py,
# spec §6.2): coordinate-aware resampling (explicit source_coords/target_coords, and interpolation
# methods beyond torch.nn.functional.interpolate's evenly-spaced-grid modes: cubic/pchip/akima
# splines, any scipy.interpolate.interp1d kind). ResampleTransform's default
# interpolation="torch" mode, and every other transform in this subpackage, need nothing beyond
# torch; importing global_vae.data.transforms never requires scipy (the import is deferred to
# ResampleTransform's own coordinate-aware code path).
interpolation = [
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# setuptools reads the literal assignment in `src/global_vae/__init__.py` without importing the
# package, so building needs neither torch nor hydra.
version = { attr = "global_vae.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker: tells mypy and other checkers that the package ships inline type hints.
global_vae = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
# N802 (function name should be lowercase), N803 (argument name should be
# lowercase), N806 (variable in function should be lowercase) are disabled
# on purpose: this project uses a deliberate custom convention where
# functions/methods are camelCase instead of PEP8 snake_case (see spec
# §10 "Naming convention" and README.md "Naming convention"). Without this
# override, ruff would silently "fix" camelCase names back to snake_case.
ignore = ["N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Tests: D101 to D104 (missing docstring on a public class, method, function or package) are
# ignored on purpose (roadmap decision D-10). A test name already states what it checks, and
# 795 of the former 987 findings in tests/ were these four rules. D100 (module docstring) and
# the style rules D2xx/D4xx still apply, so every test module keeps its docstring.
"tests/**" = ["D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["global_vae"]

[tool.mypy]
# `python_version` is the oldest Python the project supports (`requires-python`), so syntax and
# stdlib APIs newer than 3.11 are rejected. It must equal the interpreter of the CI `types` job
# (.github/workflows/ci.yaml), which tests/unit/test_typecheck_config.py guards. Type-check on
# Python 3.11: pip then installs numpy 2.4, whose stubs support 3.11. numpy 2.5 requires Python
# 3.12, and with `python_version = "3.11"` its stubs make mypy report errors that are not in the
# code (call-overload on `ndarray.min()` and `max()` in data/transforms/resample.py). On a newer
# interpreter, pass `--python-version` explicitly (roadmap P0-8).
python_version = "3.11"
strict = true
# `mypy` with no arguments checks all four trees (roadmap P0-8). `tests` is relaxed below.
files = ["src", "scripts", "examples", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "hydra.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "umap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

# mkdocs-gen-files ships partial type information: `Nav` is not re-exported explicitly and its
# constructor has no annotations. Only scripts/gen_ref_pages.py uses it. mypy names that script
# `gen_ref_pages`, because `scripts/` is not a package.
[[tool.mypy.overrides]]
module = "mkdocs_gen_files"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "gen_ref_pages"
disallow_untyped_calls = false

# Tests are checked, but a test function may carry no annotation at all (about 900 tests, and a
# test name already states what it checks). A partly annotated function is still an error:
# annotate the parameter too (`tmp_path: Path`). Everything else of `strict` applies.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` turns a misspelled or unregistered marker into an error at collection
# time, instead of a silent warning that leaves a test outside the group it was meant for.
addopts = "--strict-markers"
markers = [
    "slow: runs a script or example in a subprocess, builds the docs site or runs UMAP (skip: -m 'not slow')",
]
