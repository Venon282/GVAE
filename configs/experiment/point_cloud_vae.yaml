# @package _global_
# Full experiment for a single-modality point cloud VAE (spec §6, roadmap P3-8): assembles model +
# data + training into one composed, validated global_vae.config.experiment.ExperimentConfig. The
# point cloud counterpart of signal_vae.yaml, image_vae.yaml, tabular_vae.yaml, audio_vae.yaml,
# text_vae.yaml, time_series_vae.yaml and graph_vae.yaml.
#
# A point cloud is a set, so the loss is the Chamfer distance (`chamfer`, set in `training` below),
# which compares each point with the nearest point of the other cloud and not with whichever point
# sits at the same index: a cloud reproduced in any order scores zero (docs/adr/0044-point-cloud-
# modality.md, docs/adr/0048-reconstruction-loss-and-metric-registries.md,
# docs/how-to/train-on-point-clouds.md). `evaluate()` reports the Chamfer distance, the precision,
# the recall and the F score of the points for this loss.
#
# For another number of points, set it where it is written: the data file's
# `sequence_length.point_cloud` (the length the clouds are padded to) and the decoder's `num_points`
# (how many points it emits), for example
#   data.sequence_length.point_cloud=256 model.modalities.point_cloud.decoder.kwargs.num_points=256
# The two need not be equal: `chamfer` compares clouds of any two sizes.
defaults:
  - /model: point_cloud_single_latent
  - /data: point_cloud
  - /training: default
  - _self_

seed: 0
deterministic: false
output_dir: outputs/point_cloud_vae

# Weight (docs/adr/0029-loss-scale-convention.md, docs/adr/0044-point-cloud-modality.md,
# docs/how-to/choose-beta.md). The Chamfer distance is already a sum over points, so it has the
# scale of a summed squared error and counts as one term: `mean` and `sum` give the same number for
# it, and a weight of w on it is a beta of 1 / w on the KL term (roadmap decision D-6). On synthetic
# clouds of 40 to 64 points the Chamfer distance per point of the reconstruction was 0.086 at weight
# 1, 0.071 at 10, 0.059 at 100 and 0.058 at 1,000 (the best cloud that ignores its input scores
# 0.105), so 100 is the start of the plateau and not a tuned value.
training:
  reconstruction_loss: chamfer
  reconstruction_reduction: sum
  reconstruction_weight: 100.0
